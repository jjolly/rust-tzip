[package]
name = "tzip"
version = "0.1.3"
edition = "2021"
description = "Create, update, and validate TorrentZip-formatted ZIP files"
license = "MIT OR Apache-2.0"
keywords = ["zip", "torrentzip", "compression", "archive"]
categories = ["compression", "filesystem"]
repository = "https://github.com/jjolly/rust-tzip"
readme = "README.md"
documentation = "https://docs.rs/tzip"

[dependencies]
flate2 = { version = "1.0", default-features = false, features = ["zlib"] }
crc32fast = "1.4"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.0"
